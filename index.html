<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dr Daniel Butyter — Asystent</title>
<style>
  body { font-family: sans-serif; background: #FFFFFF; color: #1C1F1E; margin: 0; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 16px; background: #F7F7F5; border-bottom: 1px solid #E2E2DC; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 16px; }
  header p { margin: 2px 0 0; font-size: 11px; color: #6B6F6D; }
  .lang-switch { display: flex; gap: 4px; }
  .lang-btn { border: 1px solid #E2E2DC; background: white; border-radius: 6px; padding: 5px 9px; font-size: 13px; cursor: pointer; }
  .lang-btn.active { background: #1E3A5F; color: white; border-color: #1E3A5F; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; max-width: 85%; }
  .row.user { align-self: flex-end; }
  .row.bot { align-self: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .user .bubble { background: #1E3A5F; color: white; }
  .bot .bubble { background: #F7F7F5; border: 1px solid #E2E2DC; }
  footer { padding: 10px; background: #F7F7F5; border-top: 1px solid #E2E2DC; display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #E2E2DC; font-size: 14px; }
  button#sendBtn { padding: 10px 18px; border-radius: 20px; border: none; background: #1E3A5F; color: white; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="headerTitle">dr Daniel Butyter</h1>
    <p id="headerSub">Tłumacz przysięgły j. ukraińskiego</p>
  </div>
  <div class="lang-switch">
    <button class="lang-btn active" id="btnPL" onclick="setLang('pl')">PL</button>
    <button class="lang-btn" id="btnUA" onclick="setLang('ua')">UA</button>
  </div>
</header>
<main id="messages"></main>
<footer>
  <input id="input" placeholder="Napisz wiadomość...">
  <button id="sendBtn" onclick="send()">Wyślij</button>
</footer>
<script>
  const BACKEND_URL = 'https://ukrtlumacz-backend.onrender.com';
  let history = [];
  let lang = 'pl';

  const TEXT = {
    pl: { sub: 'Tłumacz przysięgły j. ukraińskiego', placeholder: 'Napisz wiadomość...', send: 'Wyślij', welcome: 'Dzień dobry! Jestem asystentem dr. Daniela Butytera. W czym mogę pomóc?' },
    ua: { sub: 'Присяжний перекладач укр. мови', placeholder: 'Напишіть повідомлення...', send: 'Надіслати', welcome: 'Доброго дня! Я асистент д-ра Даніеля Бутитера. Чим можу допомогти?' }
  };

  function setLang(l) {
    lang = l;
    document.getElementById('btnPL').classList.toggle('active', l === 'pl');
    document.getElementById('btnUA').classList.toggle('active', l === 'ua');
    document.getElementById('headerSub').textContent = TEXT[l].sub;
    document.getElementById('input').placeholder = TEXT[l].placeholder;
    document.getElementById('sendBtn').textContent = TEXT[l].send;
  }

  const messages = document.getElementById('messages');
  const input = document.getElementById('input');

  function addMsg(role, text) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    row.innerHTML = '<div class="bubble"></div>';
    row.querySelector('.bubble').textContent = text;
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    addMsg('user', text);
    history.push({role: 'user', content: text});
    input.value = '';
    addMsg('bot', '...');
    try {
      const res = await fetch(BACKEND_URL + '/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: text, history: history})
      });
      const data = await res.json();
      messages.lastChild.remove();
      addMsg('bot', data.reply);
      history.push({role: 'assistant', content: data.reply});
    } catch (e) {
      messages.lastChild.remove();
      addMsg('bot', 'Błąd: ' + e.message);
    }
  }

  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  addMsg('bot', TEXT.pl.welcome);
</script>
</body>
</html>
