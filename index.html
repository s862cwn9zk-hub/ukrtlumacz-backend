<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dr Daniel Butyter — Asystent</title>
<style>
  :root {
    --bg: #0A0A0A;
    --bg-panel: #141414;
    --border: #2A2A2A;
    --gold: #D4AF37;
    --gold-dark: #B8860B;
    --text: #F2F2F0;
    --text-dim: #9A9A94;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 18px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 {
    margin: 0;
    font-size: 16px;
    color: var(--gold);
    letter-spacing: 0.3px;
  }
  header p {
    margin: 2px 0 0;
    font-size: 11px;
    color: var(--text-dim);
  }
  .lang-switch { display: flex; gap: 6px; }
  .lang-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.55;
    transition: all 0.15s ease;
  }
  .lang-btn.active {
    opacity: 1;
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold);
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--bg);
  }
  .row { display: flex; max-width: 85%; }
  .row.user { align-self: flex-end; }
  .row.bot { align-self: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .user .bubble {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #1A1400;
    font-weight: 500;
  }
  .bot .bubble {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text);
  }
  footer {
    padding: 12px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--gold); }
  input::placeholder { color: var(--text-dim); }
  button#sendBtn {
    padding: 10px 20px;
    border-radius: 20px;
    border: none;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #1A1400;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button#sendBtn:active { transform: scale(0.97); }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="headerTitle">dr Daniel Butyter</h1>
    <p id="headerSub">Tłumacz przysięgły j. ukraińskiego</p>
  </div>
  <div class="lang-switch">
    <button class="lang-btn active" id="btnPL" onclick="setLang('pl')" title="Polski">🇵🇱</button>
    <button class="lang-btn" id="btnUA" onclick="setLang('ua')" title="Українська">🇺🇦</button>
  </div>
</header>
<main id="messages"></main>
<footer>
  <input id="input" placeholder="Napisz wiadomość...">
  <button id="sendBtn" onclick="send()">Wyślij</button>
</footer>
<script>
  const BACKEND_URL = 'https://ukrtlumacz-backend.onrender.com';
  let history = [];
  let lang = 'pl';

  const TEXT = {
    pl: {
      sub: 'Tłumacz przysięgły j. ukraińskiego',
      placeholder: 'Napisz wiadomość...',
      send: 'Wyślij',
      welcome: 'Dzień dobry! Jestem asystentem dr. Daniela Butytera. W czym mogę pomóc?',
      error: 'Błąd: '
    },
    ua: {
      sub: 'Присяжний перекладач укр. мови',
      placeholder: 'Напишіть повідомлення...',
      send: 'Надіслати',
      welcome: 'Доброго дня! Я асистент д-ра Даніеля Бутитера. Чим можу допомогти?',
      error: 'Помилка: '
    }
  };

  function setLang(l) {
    lang = l;
    document.getElementById('btnPL').classList.toggle('active', l === 'pl');
    document.getElementById('btnUA').classList.toggle('active', l === 'ua');
    document.getElementById('headerSub').textContent = TEXT[l].sub;
    document.getElementById('input').placeholder = TEXT[l].placeholder;
    document.getElementById('sendBtn').textContent = TEXT[l].send;

    // Reset rozmowy i pokaż powitanie w nowym języku
    history = [];
    messages.innerHTML = '';
    addMsg('bot', TEXT[l].welcome);
  }

  const messages = document.getElementById('messages');
  const input = document.getElementById('input');

  function addMsg(role, text) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    row.innerHTML = '<div class="bubble"></div>';
    row.querySelector('.bubble').textContent = text;
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    addMsg('user', text);
    history.push({role: 'user', content: text});
    input.value = '';
    addMsg('bot', '...');
    try {
      const res = await fetch(BACKEND_URL + '/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: text, history: history})
      });
      const data = await res.json();
      messages.lastChild.remove();
      addMsg('bot', data.reply);
      history.push({role: 'assistant', content: data.reply});
    } catch (e) {
      messages.lastChild.remove();
      addMsg('bot', TEXT[lang].error + e.message);
    }
  }

  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  addMsg('bot', TEXT.pl.welcome);
</script>
</body>
</html>
